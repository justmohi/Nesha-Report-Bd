<!doctype html>
<html lang="bn">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function() {
        try {
          var currentFetch = window.fetch;
          Object.defineProperty(window, 'fetch', {
            configurable: true,
            enumerable: true,
            get: function() {
              return currentFetch;
            },
            set: function(val) {
              currentFetch = val;
            }
          });
        } catch (e) {}

        window.addEventListener('error', function(event) {
          if (event.filename && event.filename.indexOf('chrome-extension://') !== -1) {
            if (event.stopImmediatePropagation) event.stopImmediatePropagation();
            if (event.preventDefault) event.preventDefault();
            return true;
          }
        }, true);
      })();
    </script>
    <title>Nesha Report BD</title>
    <meta name="description" content="Confidential drug-related incident reporting and law-enforcement information management platform for Bangladesh." />
    <meta property="og:title" content="Nesha Report BD" />

    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>

  </body>
</html>

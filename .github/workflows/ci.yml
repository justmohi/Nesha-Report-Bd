name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.12.0

      - name: Install archive tools
        run: sudo apt-get update && sudo apt-get install -y zstd

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Type check
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Verify Bangladesh geography coverage
        run: node -e "const fs=require('fs'); const m=JSON.parse(fs.readFileSync('public/data/bd-geo/manifest.json','utf8')); if(m.counts.divisions!==8 || m.counts.districts!==64 || m.counts.upazilas<490 || m.counts.unions<4700 || m.counts.villages<90000) throw new Error('Unexpected Bangladesh geography coverage: '+JSON.stringify(m.counts)); console.log(m.counts);"
